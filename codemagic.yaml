# Codemagic CI: verifies the plugin on iOS (Apple Silicon simulator, where
# LiteRT's arm64 binaries run). Start it manually from the Codemagic UI.
workflows:
  ios-tests:
    name: iOS build and integration tests
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.8
      xcode: latest
    scripts:
      - name: Dart analysis and unit tests
        script: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build the example for the iOS simulator
        script: |
          cd example
          flutter pub get
          if ! flutter build ios --simulator --debug -v > build_verbose.log 2>&1; then
            echo "=== Errors ==="
            grep -E "error:|Undefined symbols|ld: " build_verbose.log | sort -u | head -40
            echo "=== Link steps ==="
            grep -E "^Ld " build_verbose.log | head -20
            echo "=== Who references LiteRT ==="
            grep -A4 "_LiteRtCreateEnvironment" build_verbose.log | head -20
            echo "=== Frameworks passed to the failing link ==="
            grep -E "clang.* -o .*(Runner|debug\.dylib)" build_verbose.log | tail -1 | tr ' ' '\n' | grep -E "^-F|^-framework|CLiteRT|^-L|\.a$|\.o$" | head -60
            echo "=== Generated plugin package ==="
            cat ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift || true
            exit 1
          fi
          tail -5 build_verbose.log

      - name: Integration tests on an iOS simulator
        script: |
          cd example
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r]
                     if d["name"].startswith("iPhone")))
          ')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          flutter test integration_test -d "$UDID" --reporter expanded
