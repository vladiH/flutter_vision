name: flutter_vision_example
description: Demonstrates object detection and segmentation with flutter_vision.
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  camera: ^0.12.1
  flutter:
    sdk: flutter
  flutter_vision:
    path: ../
  image_picker: ^1.2.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/labels.txt
    - assets/yolov5n.tflite
    - assets/yolov8n.tflite
    - assets/yolov8n-seg.tflite
    - assets/yolov11n.tflite
