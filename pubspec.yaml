name: flutter_vision
description: >-
  Real-time object detection and instance segmentation with YOLO models
  (YOLOv5, v8, v9, v10, v11, v12, YOLO26) on Android and iOS, powered by
  LiteRT with CPU, GPU and NPU acceleration.
version: 3.0.0
homepage: https://github.com/vladiH/flutter_vision
repository: https://github.com/vladiH/flutter_vision
issue_tracker: https://github.com/vladiH/flutter_vision/issues
topics:
  - yolo
  - object-detection
  - segmentation
  - tflite
  - computer-vision

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.11

flutter:
  plugin:
    platforms:
      android:
        package: com.vladih.computer_vision.flutter_vision
        pluginClass: FlutterVisionPlugin
      ios:
        pluginClass: FlutterVisionPlugin
